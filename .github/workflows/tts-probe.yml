name: TTS Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q kokoro-onnx soundfile
      - run: |
          curl -sL -o kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -sL -o voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la
      - name: synth
        run: |
          mkdir out
          python - <<'PY'
          import time, soundfile as sf
          from kokoro_onnx import Kokoro
          k = Kokoro("kokoro.onnx", "voices.bin")
          items = ["proposed acquisition","categorically rejected","stems from","reproducibility crisis","empowered to adjudicate disputes","contrary to","leverage synergies","on the same page","get the hang of","acquisition","ambitious","synergies","the","portfolio"]
          t0 = time.time()
          for voice in ["am_michael", "af_heart"]:
              for i, t in enumerate(items):
                  s, sr = k.create(t, voice=voice, speed=0.95, lang="en-us")
                  sf.write(f"out/{voice}_{i:02d}.wav", s, sr)
          dt = time.time() - t0
          print(f"{2*len(items)} clips in {dt:.1f}s -> {dt/(2*len(items)):.2f}s/clip")
          PY
          for f in out/*.wav; do ffmpeg -loglevel error -y -i $f -ac 1 -codec:a libmp3lame -b:a 64k ${f%.wav}.mp3 && rm $f; done
          du -sh out
      - uses: actions/upload-artifact@v4
        with: { name: tts-probe, path: out }
