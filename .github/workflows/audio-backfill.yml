name: Audio Backfill

# Gives every phrase and word a real audio file (Kokoro, offline — no API
# quota), so taps play even when an iPhone is on mute. The first runs work
# through the whole back catalogue in checkpoints; after that it only picks up
# the few items the daily lesson job couldn't voice.
on:
  schedule:
    - cron: '30 18 * * *' # 03:30 JST, after the lesson/article/SEO jobs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KOKORO_MODEL: kokoro/kokoro-v1.0.int8.onnx
      KOKORO_VOICES: kokoro/voices-v1.0.bin
      BACKFILL_MINUTES: '300'
      COMMIT_EVERY: '800'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and Kokoro
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx soundfile

      - name: Cache the Kokoro model
        id: model
        uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-v1.0-int8

      - name: Download the Kokoro model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro
          curl -sSfL -o kokoro/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -sSfL -o kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Voice missing phrases and words
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/audio_backfill_kokoro.py
