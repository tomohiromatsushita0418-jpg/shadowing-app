name: Daily Topic Generation

on:
  schedule:
    # 15:00 UTC = 00:00 JST (next day)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Force a category (blank = daily rotation)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate new topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_CATEGORY: ${{ github.event.inputs.category }}
        run: npx tsx scripts/generateTopics.ts

      # Audio priority: sentences → phrases → words. Each step uses whatever
      # Gemini budget is left (~15 requests/day) and then overflows to
      # ElevenLabs; anything still uncovered falls back to the device's own
      # voice at runtime.
      - name: 1. Sentence audio (highest priority)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: npx tsx scripts/generateAudio.ts

      - name: Generate word meanings (incremental)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/generateWordMeanings.ts
        continue-on-error: true

      - name: Generate phrases (incremental)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/generatePhrases.ts
        continue-on-error: true

      # Instant-composition problems. Text generation (flash-lite) — a separate,
      # larger quota than TTS, so it does not compete with the audio budget.
      - name: Generate composition problems (瞬間英作文)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/generateComposition.ts
        continue-on-error: true

      - name: 2. Phrase audio (uses leftover budget)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PHRASE_AUDIO_TOPICS_TAIL: '1'
        run: npx tsx scripts/generatePhraseAudio.ts
        continue-on-error: true

      - name: 3. Word audio (lowest priority)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          WORD_AUDIO_TOPICS_TAIL: '1'
        run: npx tsx scripts/generateWordAudio.ts
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topics.json data/wordMeanings.json data/wordAudio.json data/phraseAudio.json data/composition.json assets/audio
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily topic + audio generation ($(date -u +%Y-%m-%d))"
          git push

      - name: Trigger Vercel deploy
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Notify by email (new topic link)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        # Give Vercel's git-triggered build time to finish so the link is live
        # by the time the email lands.
        run: |
          sleep 180
          python3 scripts/notify_email.py
        continue-on-error: true
