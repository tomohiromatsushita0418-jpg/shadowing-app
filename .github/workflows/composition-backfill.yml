name: Composition Backfill

# Manually generate 瞬間英作文 problem sets for recent topics.
# Text generation only (no TTS), so it does not touch the audio budget.
on:
  workflow_dispatch:
    inputs:
      tail:
        description: 'How many recent topics to cover'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Generate composition problems
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMPOSITION_TOPICS_TAIL: ${{ github.event.inputs.tail }}
          MAX_COMPOSITION_TOPICS_PER_RUN: ${{ github.event.inputs.tail }}
        run: npx tsx scripts/generateComposition.ts
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/composition.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "chore: backfill composition problems ($(date -u +%Y-%m-%d))"
          git push
