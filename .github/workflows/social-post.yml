name: Social Post

# Three posts a day, spaced out rather than fired in a burst: a phrase card in
# the morning, a translation quiz at lunch, the episode announcement in the
# evening. That is 90 posts a month, well inside X's free-tier limit of 500.
#
# A platform with no credentials configured is skipped, so you can enable each
# account as you finish setting it up.
on:
  schedule:
    - cron: '30 22 * * *' # 07:30 JST — phrase
    - cron: '30 3 * * *'  # 12:30 JST — quiz
    - cron: '30 11 * * *' # 20:30 JST — episode
  workflow_dispatch:
    inputs:
      kind:
        description: 'phrase | quiz | episode | all'
        required: false
        default: 'all'
      dry_run:
        description: 'Set to 1 to print the posts without publishing'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Choose which post this run publishes
        id: kind
        run: |
          if [ -n "${{ github.event.inputs.kind }}" ]; then
            echo "kind=${{ github.event.inputs.kind }}" >> "$GITHUB_OUTPUT"
          else
            case "$(date -u +%H)" in
              22) echo "kind=phrase"  >> "$GITHUB_OUTPUT" ;;
              03) echo "kind=quiz"    >> "$GITHUB_OUTPUT" ;;
              11) echo "kind=episode" >> "$GITHUB_OUTPUT" ;;
              *)  echo "kind=phrase"  >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Post
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SOCIAL_POST_KIND: ${{ steps.kind.outputs.kind }}
          SOCIAL_DRY_RUN: ${{ github.event.inputs.dry_run }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: npx tsx scripts/social/post.ts
