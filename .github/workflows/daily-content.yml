name: Daily Article

# Runs two hours after Daily Topic Generation (15:00 UTC) so the episode it
# writes about already exists and the commits never race.
on:
  schedule:
    - cron: '0 17 * * *' # 02:00 JST
  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Episode index to write about (-1 = newest)'
        required: false
        default: '-1'
      force:
        description: 'Overwrite an existing article for that episode'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Generate the day's article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTICLE_TOPIC_INDEX: ${{ github.event.inputs.topic_index || '-1' }}
          ARTICLE_FORCE: ${{ github.event.inputs.force }}
        run: npx tsx scripts/generateArticle.ts

      # Catches a broken template or a bad article before it reaches the site.
      - name: Verify the site still builds
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: npx tsx seo/build.ts

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/content
          if git diff --cached --quiet; then
            echo "No new article."
            exit 0
          fi
          git commit -m "chore: daily article ($(date -u +%Y-%m-%d))"
          git push
