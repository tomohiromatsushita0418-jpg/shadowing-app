name: YouTube Short

# "Ren & Mio" English mini-drama: one idiom per episode, a 30–45 s two-person
# scene that continues a running story, with English + Japanese subtitles.
#
#   drama.ts       Gemini writes the scene (idiom from the newest lessons) and
#                  voices both characters in one multi-speaker TTS call.
#   dramaVideo.ts  ffmpeg renders the vertical Short.
#   youtube.ts     uploads it (unlisted unless YOUTUBE_PRIVACY=public).
#
# The story only advances (data/drama.json) after a successful upload, so a
# render-only run never skips an episode.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'true to upload to YouTube, false to only render'
        required: false
        default: 'false'
  schedule:
    - cron: '0 10 * * *' # 19:00 JST

permissions:
  contents: write

concurrency:
  group: youtube-short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    env:
      DRAMA_OUT: build/drama
      VIDEO_OUT: build/short.mp4
      UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.upload == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Install ffmpeg and a CJK font
        # Current ubuntu runners no longer ship ffmpeg, and never had a Japanese font.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -version | head -1

      - name: Write and voice today's episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/social/drama.ts

      - name: Render the Short
        run: npx tsx scripts/social/dramaVideo.ts

      - name: Keep the rendering for review
        uses: actions/upload-artifact@v4
        with:
          name: short-mp4
          path: |
            build/short.mp4
            build/drama/script.json
          retention-days: 7

      - name: Publish to YouTube
        if: env.UPLOAD == 'true'
        env:
          YT_META: build/drama/script.json
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
        run: npx tsx scripts/social/youtube.ts

      - name: Advance the story
        if: env.UPLOAD == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          state = json.load(open('build/drama/state.json'))
          script = json.load(open('build/drama/script.json'))
          if os.path.exists('build/drama/video.json'):
              v = json.load(open('build/drama/video.json'))
              state.setdefault('videos', []).append({
                  'episode': script['episode'], 'id': v['id'], 'idiom': script['idiom'],
                  'meaning': script['meaning'], 'title': script['title'], 'uploadedAt': v['uploadedAt'],
              })
              state['videos'] = state['videos'][-90:]
          json.dump(state, open('data/drama.json', 'w'), ensure_ascii=False, indent=2)
          open('data/drama.json', 'a').write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/drama.json
          git commit -m "drama: episode $(python3 -c "import json;print(json.load(open('data/drama.json'))['episode'])")" || exit 0
          git pull --rebase origin main
          git push
